<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>시스템 전환 안내 | 가지 병해 현장조사</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
    p { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin-bottom: 24px; word-break: keep-all; }
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: #0f172a;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover, .btn:active { background: var(--primary-hover); }
    .meta { margin-top: 20px; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🍆</div>
    <h1>신규 현장조사 시스템 전환 안내</h1>
    <p>가지 병해 현장조사 시스템이 보안 인증이 강화된 정식 운영 버전으로 전환되었습니다. 기존 테스트 페이지 대신 아래 버튼을 눌러 정식 운영 페이지로 이동해 주세요.</p>
    <a href="./index.html" class="btn">정식 현장조사 페이지로 이동</a>
    <div class="meta">가지 병해 현장조사 v1.0.0</div>
  </div>
</body>
</html>
