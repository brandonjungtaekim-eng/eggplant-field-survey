<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>음성 카운팅 반응속도 테스트 (Voice Counting Test V2)</title>
<style>
:root {
  --bg-dark: #0f172a;
  --text-light: #f8fafc;
  --text-muted: #94a3b8;
  
  /* 4개 영역 고대비 테마 */
  --box-a-bg: #064e3b;
  --box-a-border: #10b981;
  --box-a-highlight: #34d399;

  --box-b-bg: #7f1d1d;
  --box-b-border: #ef4444;
  --box-b-highlight: #f87171;

  --box-c-bg: #1e3a8a;
  --box-c-border: #3b82f6;
  --box-c-highlight: #60a5fa;

  --box-x-bg: #581c87;
  --box-x-border: #a855f7;
  --box-x-highlight: #c084fc;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-light);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: env(safe-area-inset-top, 6px) env(safe-area-inset-right, 6px) env(safe-area-inset-bottom, 6px) env(safe-area-inset-left, 6px);
}

/* 상단 컨트롤 및 상태 헤더 */
header {
  padding: 8px 12px;
  background: #1e293b;
  border-radius: 12px;
  margin-bottom: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: #38bdf8;
}

.top-badges {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* FAST MODE 토글 스위치 */
.mode-toggle-btn {
  font-size: 12px;
  font-weight: 900;
  padding: 5px 9px;
  border-radius: 20px;
  border: 1px solid #eab308;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}

.mode-fast {
  background: #ca8a04;
  color: #ffffff;
  border-color: #facc15;
  box-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
}

.mode-normal {
  background: #334155;
  color: #94a3b8;
  border-color: #64748b;
}

.mic-badge {
  font-size: 12px;
  font-weight: 800;
  padding: 5px 9px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid transparent;
}

.mic-off {
  background: #334155;
  color: #94a3b8;
  border-color: #475569;
}

.mic-listening {
  background: #166534;
  color: #ffffff;
  border-color: #22c55e;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.header-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-ctrl {
  flex: 1;
  padding: 9px 0;
  font-size: 15px;
  font-weight: 800;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4px;
}

.btn-start {
  background: #22c55e;
  color: #052e16;
}

.btn-start:active {
  background: #16a34a;
}

.btn-stop {
  background: #ef4444;
  color: #ffffff;
}

.btn-stop:active {
  background: #dc2626;
}

.btn-reset {
  flex: 0 0 55px;
  background: #475569;
  color: #f8fafc;
  font-size: 13px;
}

.recent-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-muted);
  padding: 0 2px;
}

.recent-val {
  font-weight: 800;
  color: #facc15;
}

/* 2 x 2 카운팅 메인 그리드 */
.grid-container {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 8px;
  margin-bottom: 6px;
}

.count-card {
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px;
  position: relative;
  transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s ease;
  border: 3px solid;
}

/* 카드별 컬러 테마 */
.card-a { background: var(--box-a-bg); border-color: var(--box-a-border); }
.card-b { background: var(--box-b-bg); border-color: var(--box-b-border); }
.card-c { background: var(--box-c-bg); border-color: var(--box-c-border); }
.card-x { background: var(--box-x-bg); border-color: var(--box-x-border); }

/* 인식 시 플래시 효과 */
.card-a.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-a-highlight); transform: scale(1.02); }
.card-b.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-b-highlight); transform: scale(1.02); }
.card-c.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-c-highlight); transform: scale(1.02); }
.card-x.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-x-highlight); transform: scale(1.02); }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.key-label {
  font-size: 28px;
  font-weight: 900;
  line-height: 1;
}

.name-label {
  font-size: 13px;
  font-weight: 700;
  opacity: 0.9;
  text-align: right;
  line-height: 1.2;
}

/* 야외 시인성을 위한 초대형 카운트 숫자 */
.count-num {
  font-size: clamp(52px, 14vw, 86px);
  font-weight: 900;
  text-align: center;
  line-height: 1;
  color: #ffffff;
  text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
  margin: auto 0;
}

/* 수동 오인식 수정 버튼 (+ / -) */
.card-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.step-btn {
  width: 44px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #ffffff;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step-btn:active {
  background: rgba(255, 255, 255, 0.5);
  transform: scale(0.95);
}

/* 하단 자동 계산 바 */
footer {
  background: #1e293b;
  border-radius: 12px;
  padding: 10px 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  border: 1px solid #334155;
}

.calc-box {
  display: flex;
  flex-direction: column;
}

.calc-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.calc-val {
  font-size: 18px;
  font-weight: 900;
  color: #f8fafc;
}

.calc-val b {
  color: #38bdf8;
  font-size: 20px;
}
</style>
</head>
<body>

<!-- 상단 헤더: 제목, 모드 스위치, 마이크 상태, 제어 버튼 -->
<header>
  <div class="header-top">
    <div class="title">🎤 VOICE COUNTING TEST</div>
    <div class="top-badges">
      <button type="button" id="modeToggleBtn" class="mode-toggle-btn mode-fast">
        <span id="modeIcon">⚡</span> <span id="modeText">FAST MODE ON</span>
      </button>
      <div id="micStatus" class="mic-badge mic-off">
        <span id="micDot">●</span> <span id="micText">OFF</span>
      </div>
    </div>
  </div>

  <div class="header-controls">
    <button type="button" id="startBtn" class="btn-ctrl btn-start">▶ 음성 시작</button>
    <button type="button" id="stopBtn" class="btn-ctrl btn-stop">■ 음성 종료</button>
    <button type="button" id="resetBtn" class="btn-ctrl btn-reset">초기화</button>
  </div>

  <div class="recent-bar">
    <span>명령어: <b>A</b>(건강과실) <b>B</b>(병든과실) <b>C</b>(건강봉오리) <b>X</b>(병든봉오리)</span>
    <span>최근 인식: <span id="recentLog" class="recent-val">-</span></span>
  </div>
</header>

<!-- 중앙 2 x 2 카운팅 메인 영역 -->
<main class="grid-container">
  <!-- A: 건강한 과실 -->
  <section class="count-card card-a" id="cardA">
    <div class="card-header">
      <span class="key-label">A</span>
      <span class="name-label">건강한 과실</span>
    </div>
    <div class="count-num" id="numA">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="A" data-delta="-1" aria-label="A 감소">−</button>
      <button type="button" class="step-btn" data-target="A" data-delta="1" aria-label="A 증가">＋</button>
    </div>
  </section>

  <!-- B: 병든 과실 -->
  <section class="count-card card-b" id="cardB">
    <div class="card-header">
      <span class="key-label">B</span>
      <span class="name-label">병든 과실</span>
    </div>
    <div class="count-num" id="numB">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="B" data-delta="-1" aria-label="B 감소">−</button>
      <button type="button" class="step-btn" data-target="B" data-delta="1" aria-label="B 증가">＋</button>
    </div>
  </section>

  <!-- C: 건강한 봉오리 -->
  <section class="count-card card-c" id="cardC">
    <div class="card-header">
      <span class="key-label">C</span>
      <span class="name-label">건강한 봉오리</span>
    </div>
    <div class="count-num" id="numC">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="C" data-delta="-1" aria-label="C 감소">−</button>
      <button type="button" class="step-btn" data-target="C" data-delta="1" aria-label="C 증가">＋</button>
    </div>
  </section>

  <!-- X: 병든 봉오리 (기존 D에서 변경) -->
  <section class="count-card card-x" id="cardX">
    <div class="card-header">
      <span class="key-label">X</span>
      <span class="name-label">병든 봉오리</span>
    </div>
    <div class="count-num" id="numX">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="X" data-delta="-1" aria-label="X 감소">−</button>
      <button type="button" class="step-btn" data-target="X" data-delta="1" aria-label="X 증가">＋</button>
    </div>
  </section>
</main>

<!-- 하단 자동 계산 바 -->
<footer>
  <div class="calc-box">
    <div class="calc-title">조사 과실 수 (A + B)</div>
    <div class="calc-val"><b id="totalFruit">0</b> 개</div>
  </div>
  <div class="calc-box">
    <div class="calc-title">조사 봉오리 수 (C + X)</div>
    <div class="calc-val"><b id="totalBud">0</b> 개</div>
  </div>
</footer>

<script>
// 카운터 상태 관리 (A, B, C, X)
const counts = { A: 0, B: 0, C: 0, X: 0 };
let isUserListening = false;
let isFastMode = true; // 기본값 FAST MODE (interim 기반 즉시 처리)
let recognition = null;
let restartTimeout = null;

// 중복 방지(Deduplication)를 위한 세그먼트별 소비 토큰 개수 추적 맵
// key: resultIndex (세그먼트 인덱스), value: 이미 카운트 반영된 토큰 개수
const segmentConsumedCounts = {};

const $ = id => document.getElementById(id);

// UI 갱신 함수
function updateUI() {
  $('numA').textContent = counts.A;
  $('numB').textContent = counts.B;
  $('numC').textContent = counts.C;
  $('numX').textContent = counts.X;

  $('totalFruit').textContent = counts.A + counts.B;
  $('totalBud').textContent = counts.C + counts.X;
}

// 카운트 증가 및 시각/진동 피드백
function triggerCount(key, amount = 1) {
  if (!counts.hasOwnProperty(key)) return;
  counts[key] = Math.max(0, counts[key] + amount);
  updateUI();

  // 최근 인식 로그 업데이트
  $('recentLog').textContent = `${key} (+${amount})`;

  // 카드 하이라이트 애니메이션
  const card = $(`card${key}`);
  if (card) {
    card.classList.remove('highlight');
    void card.offsetWidth; // DOM reflow로 연속 트리거 시 애니메이션 재시작
    card.classList.add('highlight');
    setTimeout(() => card.classList.remove('highlight'), 250);
  }

  // 모바일 진동 피드백 (지원 브라우저)
  if (navigator.vibrate) {
    try {
      navigator.vibrate(80);
    } catch (e) {}
  }
}

// 수동 + / - 버튼 클릭 이벤트
document.querySelectorAll('.step-btn').forEach(btn => {
  btn.onclick = (e) => {
    e.stopPropagation();
    const target = btn.dataset.target;
    const delta = +btn.dataset.delta;
    triggerCount(target, delta);
  };
});

// 전체 초기화
$('resetBtn').onclick = () => {
  if (confirm('모든 카운트를 0으로 초기화할까요?')) {
    counts.A = 0;
    counts.B = 0;
    counts.C = 0;
    counts.X = 0;
    $('recentLog').textContent = '-';
    for (const k in segmentConsumedCounts) delete segmentConsumedCounts[k];
    updateUI();
  }
};

// FAST MODE 토글 기능
$('modeToggleBtn').onclick = () => {
  isFastMode = !isFastMode;
  const btn = $('modeToggleBtn');
  const icon = $('modeIcon');
  const text = $('modeText');

  if (isFastMode) {
    btn.className = 'mode-toggle-btn mode-fast';
    icon.textContent = '⚡';
    text.textContent = 'FAST MODE ON';
    $('recentLog').textContent = 'FAST 모드 전환 (실시간)';
  } else {
    btn.className = 'mode-toggle-btn mode-normal';
    icon.textContent = '🐢';
    text.textContent = 'NORMAL (침묵후)';
    $('recentLog').textContent = 'NORMAL 모드 전환 (침묵대기)';
  }
};

// Web Speech API 지원 확인
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function updateMicUI(listening) {
  const badge = $('micStatus');
  const text = $('micText');
  if (listening) {
    badge.className = 'mic-badge mic-listening';
    text.textContent = 'LISTENING';
  } else {
    badge.className = 'mic-badge mic-off';
    text.textContent = 'OFF';
  }
}

// 다중 발화 토큰 파싱 로직
// "A A A C B X" 또는 "에이 에이 에이 씨 비 엑스" 등 순서대로 모든 명령어 추출
function parseSpeechCommands(text) {
  const clean = text.toLowerCase().trim();
  const tokens = clean.split(/[\s,.]+/).filter(Boolean);
  const detected = [];

  // 각 토큰별 매핑 정의
  const mapA = ['a', '에이', '애이', '예이', 'eh'];
  const mapB = ['b', '비', 'bee', '미'];
  const mapC = ['c', '씨', '시', 'see', 'sea'];
  const mapX = ['x', '엑스', '액스', 'ex', 'eks', 'exes', '익스'];

  tokens.forEach(tok => {
    if (mapA.includes(tok)) detected.push('A');
    else if (mapB.includes(tok)) detected.push('B');
    else if (mapC.includes(tok)) detected.push('C');
    else if (mapX.includes(tok)) detected.push('X');
    else {
      // 띄어쓰기 없이 붙여서 인식된 경우(예: '에이에이', 'aab', '엑스엑스') 서브패턴 스캔
      let sub = tok;
      while (sub.length > 0) {
        if (sub.startsWith('에이') || sub.startsWith('애이')) { detected.push('A'); sub = sub.slice(2); }
        else if (sub.startsWith('엑스') || sub.startsWith('액스')) { detected.push('X'); sub = sub.slice(2); }
        else if (sub.startsWith('a')) { detected.push('A'); sub = sub.slice(1); }
        else if (sub.startsWith('b')) { detected.push('B'); sub = sub.slice(1); }
        else if (sub.startsWith('c')) { detected.push('C'); sub = sub.slice(1); }
        else if (sub.startsWith('x')) { detected.push('X'); sub = sub.slice(1); }
        else if (sub.startsWith('비')) { detected.push('B'); sub = sub.slice(1); }
        else if (sub.startsWith('씨') || sub.startsWith('시')) { detected.push('C'); sub = sub.slice(1); }
        else { break; }
      }
    }
  });

  return detected;
}

function initRecognition() {
  if (!SpeechRecognition) {
    alert('이 브라우저는 Web Speech API를 지원하지 않습니다.\nAndroid Chrome 또는 iOS Safari 최신 버전을 사용해주세요.');
    return null;
  }

  const rec = new SpeechRecognition();
  rec.lang = 'ko-KR'; // 한국어 모드
  rec.continuous = true; // 연속 청취 모드
  rec.interimResults = true; // FAST MODE를 위해 상시 interim 수신 활성화
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    updateMicUI(true);
  };

  rec.onresult = (event) => {
    // resultIndex부터 현재 results 끝까지 순회
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      const res = event.results[i];
      const isFinal = res.isFinal;
      const transcript = res[0].transcript;
      const parsedTokens = parseSpeechCommands(transcript);

      if (isFastMode) {
        // [FAST MODE]: interim 결과가 도착하는 즉시 신규 토큰만 카운트 (Deduplication)
        const alreadyConsumed = segmentConsumedCounts[i] || 0;
        
        if (parsedTokens.length > alreadyConsumed) {
          // 아직 카운트되지 않은 새로운 토큰들만 슬라이스
          const newTokens = parsedTokens.slice(alreadyConsumed);
          newTokens.forEach(cmd => triggerCount(cmd, 1));
          segmentConsumedCounts[i] = parsedTokens.length;
        }

        // 해당 세그먼트가 최종 완료(isFinal)되면 메모리 정리 및 확정
        if (isFinal) {
          segmentConsumedCounts[i] = Math.max(segmentConsumedCounts[i] || 0, parsedTokens.length);
        }
      } else {
        // [NORMAL MODE (기존 방식)]: interim은 무시하고 isFinal 확정 시에만 1회 처리
        if (isFinal) {
          if (parsedTokens.length > 0) {
            parsedTokens.forEach(cmd => triggerCount(cmd, 1));
          } else {
            $('recentLog').textContent = `미인식: "${transcript.trim()}"`;
          }
        }
      }
    }
  };

  rec.onerror = (event) => {
    console.warn('Speech recognition error:', event.error);
    if (event.error === 'not-allowed') {
      alert('마이크 사용 권한이 거부되었습니다. 브라우저 설정에서 마이크를 허용해주세요.');
      isUserListening = false;
      updateMicUI(false);
    }
  };

  rec.onend = () => {
    updateMicUI(false);
    // 사용자가 종료 버튼을 누르지 않았는데 연결이 끊긴 경우 자동 재시작
    if (isUserListening) {
      clearTimeout(restartTimeout);
      restartTimeout = setTimeout(() => {
        if (isUserListening) {
          try {
            rec.start();
          } catch (e) {
            console.log('재시작 대기:', e);
          }
        }
      }, 250);
    }
  };

  return rec;
}

// "음성 시작" 버튼
$('startBtn').onclick = () => {
  if (!recognition) {
    recognition = initRecognition();
    if (!recognition) return;
  }
  isUserListening = true;
  for (const k in segmentConsumedCounts) delete segmentConsumedCounts[k];
  try {
    recognition.start();
  } catch (e) {
    // 이미 실행 중인 경우
  }
};

// "음성 종료" 버튼
$('stopBtn').onclick = () => {
  isUserListening = false;
  clearTimeout(restartTimeout);
  if (recognition) {
    try {
      recognition.stop();
    } catch (e) {}
  }
  updateMicUI(false);
};

// 초기 화면 세팅
updateUI();
</script>
</body>
</html>
