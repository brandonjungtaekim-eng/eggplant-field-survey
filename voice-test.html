<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>음성 카운팅 반응속도 테스트 (Voice Counting Test V2)</title>
<style>
:root {
  --bg-dark: #0f172a;
  --text-light: #f8fafc;
  --text-muted: #94a3b8;
  
  /* 4개 영역 고대비 테마 */
  --box-a-bg: #064e3b;
  --box-a-border: #10b981;
  --box-a-highlight: #34d399;

  --box-b-bg: #7f1d1d;
  --box-b-border: #ef4444;
  --box-b-highlight: #f87171;

  --box-c-bg: #1e3a8a;
  --box-c-border: #3b82f6;
  --box-c-highlight: #60a5fa;

  --box-x-bg: #581c87;
  --box-x-border: #a855f7;
  --box-x-highlight: #c084fc;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-light);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  padding: env(safe-area-inset-top, 6px) env(safe-area-inset-right, 6px) env(safe-area-inset-bottom, 6px) env(safe-area-inset-left, 6px);
}

/* 상단 컨트롤 및 상태 헤더 */
header {
  padding: 8px 10px;
  background: #1e293b;
  border-radius: 12px;
  margin-bottom: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: #38bdf8;
}

.top-badges {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* FAST MODE 토글 스위치 */
.mode-toggle-btn {
  font-size: 12px;
  font-weight: 900;
  padding: 5px 9px;
  border-radius: 20px;
  border: 1px solid #eab308;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}

.mode-fast {
  background: #ca8a04;
  color: #ffffff;
  border-color: #facc15;
  box-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
}

.mode-normal {
  background: #334155;
  color: #94a3b8;
  border-color: #64748b;
}

.mic-badge {
  font-size: 12px;
  font-weight: 800;
  padding: 5px 9px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid transparent;
}

.mic-off {
  background: #334155;
  color: #94a3b8;
  border-color: #475569;
}

.mic-listening {
  background: #166534;
  color: #ffffff;
  border-color: #22c55e;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.header-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-ctrl {
  flex: 1;
  padding: 8px 0;
  font-size: 14px;
  font-weight: 800;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4px;
}

.btn-start {
  background: #22c55e;
  color: #052e16;
}

.btn-start:active {
  background: #16a34a;
}

.btn-stop {
  background: #ef4444;
  color: #ffffff;
}

.btn-stop:active {
  background: #dc2626;
}

.btn-reset {
  flex: 0 0 52px;
  background: #475569;
  color: #f8fafc;
  font-size: 13px;
}

.recent-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-muted);
  padding: 0 2px;
}

.recent-val {
  font-weight: 800;
  color: #facc15;
}

/* 조사 메타데이터 입력 패널 */
.meta-panel {
  background: #1e293b;
  border-radius: 12px;
  padding: 8px 10px;
  margin-bottom: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1px solid #334155;
}

.meta-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.meta-col {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.meta-col label {
  font-size: 11px;
  font-weight: 800;
  color: var(--text-muted);
}

.meta-col select,
.meta-col input {
  height: 38px;
  border-radius: 8px;
  border: 1.5px solid #475569;
  background: #0f172a;
  color: #ffffff;
  padding: 0 8px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
}

.meta-col select:focus,
.meta-col input:focus {
  outline: none;
  border-color: #38bdf8;
}

/* 2 x 2 카운팅 메인 그리드 */
.grid-container {
  flex: 1;
  min-height: 280px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 8px;
  margin-bottom: 6px;
}

.count-card {
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px;
  position: relative;
  transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s ease;
  border: 3px solid;
}

/* 카드별 컬러 테마 */
.card-a { background: var(--box-a-bg); border-color: var(--box-a-border); }
.card-b { background: var(--box-b-bg); border-color: var(--box-b-border); }
.card-c { background: var(--box-c-bg); border-color: var(--box-c-border); }
.card-x { background: var(--box-x-bg); border-color: var(--box-x-border); }

/* 인식 시 플래시 효과 */
.card-a.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-a-highlight); transform: scale(1.02); }
.card-b.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-b-highlight); transform: scale(1.02); }
.card-c.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-c-highlight); transform: scale(1.02); }
.card-x.highlight { border-color: #ffffff; box-shadow: 0 0 25px var(--box-x-highlight); transform: scale(1.02); }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.key-label {
  font-size: 28px;
  font-weight: 900;
  line-height: 1;
}

.name-label {
  font-size: 13px;
  font-weight: 700;
  opacity: 0.9;
  text-align: right;
  line-height: 1.2;
}

/* 야외 시인성을 위한 초대형 카운트 숫자 */
.count-num {
  font-size: clamp(48px, 12vw, 82px);
  font-weight: 900;
  text-align: center;
  line-height: 1;
  color: #ffffff;
  text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
  margin: auto 0;
}

/* 수동 오인식 수정 버튼 (+ / -) */
.card-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.step-btn {
  width: 44px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #ffffff;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step-btn:active {
  background: rgba(255, 255, 255, 0.5);
  transform: scale(0.95);
}

/* 하단 자동 계산 및 저장 영역 */
footer {
  background: #1e293b;
  border-radius: 12px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1px solid #334155;
}

.footer-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.calc-box {
  display: flex;
  flex-direction: column;
}

.calc-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.calc-val {
  font-size: 16px;
  font-weight: 900;
  color: #f8fafc;
}

.calc-val b {
  color: #38bdf8;
  font-size: 18px;
}

/* 저장 + 다음 버튼 */
.btn-save-next {
  flex: 1.2;
  height: 46px;
  background: #16a34a;
  color: #ffffff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 3px 0 #15803d;
  transition: all 0.1s ease;
}

.btn-save-next:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #15803d;
}

.btn-save-next:disabled {
  background: #475569;
  color: #94a3b8;
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}

/* 저장 상태 알림 메시지 바 */
.save-status-msg {
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 800;
  text-align: center;
  animation: fadeIn 0.2s ease;
}

.status-success {
  background: #15803d;
  color: #ffffff;
}

.status-warn {
  background: #ca8a04;
  color: #ffffff;
}

.status-error {
  background: #b91c1c;
  color: #ffffff;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- 상단 헤더: 제목, 모드 스위치, 마이크 상태, 제어 버튼 -->
<header>
  <div class="header-top">
    <div class="title">🎤 VOICE COUNTING TEST</div>
    <div class="top-badges">
      <button type="button" id="modeToggleBtn" class="mode-toggle-btn mode-fast">
        <span id="modeIcon">⚡</span> <span id="modeText">FAST MODE ON</span>
      </button>
      <div id="micStatus" class="mic-badge mic-off">
        <span id="micDot">●</span> <span id="micText">OFF</span>
      </div>
    </div>
  </div>

  <div class="header-controls">
    <button type="button" id="startBtn" class="btn-ctrl btn-start">▶ 음성 시작</button>
    <button type="button" id="stopBtn" class="btn-ctrl btn-stop">■ 음성 종료</button>
    <button type="button" id="resetBtn" class="btn-ctrl btn-reset">초기화</button>
  </div>

  <div class="recent-bar">
    <span>명령어: <b>A</b>(건강과실) <b>B</b>(병든과실) <b>C</b>(건강봉오리) <b>X</b>(병든봉오리)</span>
    <span>최근 인식: <span id="recentLog" class="recent-val">-</span></span>
  </div>
</header>

<!-- 조사 메타데이터 입력 패널 (D1 연동) -->
<section class="meta-panel">
  <div class="meta-row">
    <div class="meta-col" style="flex: 1.2;">
      <label for="surveyDate">조사일자</label>
      <input type="date" id="surveyDate">
    </div>
    <div class="meta-col" style="flex: 0.9;">
      <label for="researcherId">조사자</label>
      <select id="researcherId">
        <option value="R1">R1</option>
        <option value="R2">R2</option>
        <option value="R3">R3</option>
        <option value="R4">R4</option>
      </select>
    </div>
    <div class="meta-col" style="flex: 1.4;">
      <label for="farmId">농가 / 농장주</label>
      <select id="farmId">
        <option value="G1">G1 (윤종우)</option>
        <option value="G2">G2 (안철우)</option>
        <option value="G3">G3 (손범식)</option>
        <option value="G4">G4 (전충호)</option>
        <option value="G5">G5 (최종건)</option>
        <option value="G6">G6 (박기환)</option>
      </select>
    </div>
  </div>
  <div class="meta-row">
    <div class="meta-col" style="flex: 1.1;">
      <label for="individualId">개체 ID <span style="color:#ef4444">*</span></label>
      <input type="text" id="individualId" placeholder="예: 1-1" autocomplete="off">
    </div>
    <div class="meta-col" style="flex: 1.9;">
      <label for="note">비고</label>
      <input type="text" id="note" placeholder="메모 (필요 시)">
    </div>
  </div>
</section>

<!-- 중앙 2 x 2 카운팅 메인 영역 -->
<main class="grid-container">
  <!-- A: 건강한 과실 -->
  <section class="count-card card-a" id="cardA">
    <div class="card-header">
      <span class="key-label">A</span>
      <span class="name-label">건강한 과실</span>
    </div>
    <div class="count-num" id="numA">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="A" data-delta="-1" aria-label="A 감소">−</button>
      <button type="button" class="step-btn" data-target="A" data-delta="1" aria-label="A 증가">＋</button>
    </div>
  </section>

  <!-- B: 병든 과실 -->
  <section class="count-card card-b" id="cardB">
    <div class="card-header">
      <span class="key-label">B</span>
      <span class="name-label">병든 과실</span>
    </div>
    <div class="count-num" id="numB">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="B" data-delta="-1" aria-label="B 감소">−</button>
      <button type="button" class="step-btn" data-target="B" data-delta="1" aria-label="B 증가">＋</button>
    </div>
  </section>

  <!-- C: 건강한 봉오리 -->
  <section class="count-card card-c" id="cardC">
    <div class="card-header">
      <span class="key-label">C</span>
      <span class="name-label">건강한 봉오리</span>
    </div>
    <div class="count-num" id="numC">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="C" data-delta="-1" aria-label="C 감소">−</button>
      <button type="button" class="step-btn" data-target="C" data-delta="1" aria-label="C 증가">＋</button>
    </div>
  </section>

  <!-- X: 병든 봉오리 (기존 D에서 변경) -->
  <section class="count-card card-x" id="cardX">
    <div class="card-header">
      <span class="key-label">X</span>
      <span class="name-label">병든 봉오리</span>
    </div>
    <div class="count-num" id="numX">0</div>
    <div class="card-footer">
      <button type="button" class="step-btn" data-target="X" data-delta="-1" aria-label="X 감소">−</button>
      <button type="button" class="step-btn" data-target="X" data-delta="1" aria-label="X 증가">＋</button>
    </div>
  </section>
</main>

<!-- 하단 자동 계산 바 및 저장 영역 -->
<footer>
  <div class="footer-top-row">
    <div class="calc-box">
      <div class="calc-title">과실 (A+B)</div>
      <div class="calc-val"><b id="totalFruit">0</b> 개</div>
    </div>
    <div class="calc-box">
      <div class="calc-title">봉오리 (C+X)</div>
      <div class="calc-val"><b id="totalBud">0</b> 개</div>
    </div>
    <button type="button" id="btnSaveNext" class="btn-save-next">
      💾 저장 + 다음
    </button>
  </div>
  <div id="saveStatus" class="save-status-msg" style="display:none;"></div>
</footer>

<script>
// 농가 매핑
const FARM_OWNERS = {
  G1: '윤종우',
  G2: '안철우',
  G3: '손범식',
  G4: '전충호',
  G5: '최종건',
  G6: '박기환'
};

// 카운터 상태 관리 (A, B, C, X)
const counts = { A: 0, B: 0, C: 0, X: 0 };
let isUserListening = false;
let isFastMode = true; // 기본값 FAST MODE (interim 기반 즉시 처리)
let recognition = null;
let restartTimeout = null;

// 중복 방지(Deduplication)를 위한 세그먼트별 소비 토큰 개수 추적 맵
// key: resultIndex (세그먼트 인덱스), value: 이미 카운트 반영된 토큰 개수
const segmentConsumedCounts = {};

const $ = id => document.getElementById(id);

// 로컬 날짜(YYYY-MM-DD) 반환
function getTodayString() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// UI 갱신 함수
function updateUI() {
  $('numA').textContent = counts.A;
  $('numB').textContent = counts.B;
  $('numC').textContent = counts.C;
  $('numX').textContent = counts.X;

  $('totalFruit').textContent = counts.A + counts.B;
  $('totalBud').textContent = counts.C + counts.X;
}

// 카운트 증가 및 시각/진동 피드백
function triggerCount(key, amount = 1) {
  if (!counts.hasOwnProperty(key)) return;
  counts[key] = Math.max(0, counts[key] + amount);
  updateUI();

  // 최근 인식 로그 업데이트
  $('recentLog').textContent = `${key} (+${amount})`;

  // 카드 하이라이트 애니메이션
  const card = $(`card${key}`);
  if (card) {
    card.classList.remove('highlight');
    void card.offsetWidth; // DOM reflow로 연속 트리거 시 애니메이션 재시작
    card.classList.add('highlight');
    setTimeout(() => card.classList.remove('highlight'), 250);
  }

  // 모바일 진동 피드백 (지원 브라우저)
  if (navigator.vibrate) {
    try {
      navigator.vibrate(80);
    } catch (e) {}
  }
}

// 수동 + / - 버튼 클릭 이벤트
document.querySelectorAll('.step-btn').forEach(btn => {
  btn.onclick = (e) => {
    e.stopPropagation();
    const target = btn.dataset.target;
    const delta = +btn.dataset.delta;
    triggerCount(target, delta);
  };
});

// 전체 초기화
$('resetBtn').onclick = () => {
  if (confirm('모든 카운트를 0으로 초기화할까요?')) {
    counts.A = 0;
    counts.B = 0;
    counts.C = 0;
    counts.X = 0;
    $('recentLog').textContent = '-';
    for (const k in segmentConsumedCounts) delete segmentConsumedCounts[k];
    updateUI();
  }
};

// FAST MODE 토글 기능
$('modeToggleBtn').onclick = () => {
  isFastMode = !isFastMode;
  const btn = $('modeToggleBtn');
  const icon = $('modeIcon');
  const text = $('modeText');

  if (isFastMode) {
    btn.className = 'mode-toggle-btn mode-fast';
    icon.textContent = '⚡';
    text.textContent = 'FAST MODE ON';
    $('recentLog').textContent = 'FAST 모드 전환 (실시간)';
  } else {
    btn.className = 'mode-toggle-btn mode-normal';
    icon.textContent = '🐢';
    text.textContent = 'NORMAL (침묵후)';
    $('recentLog').textContent = 'NORMAL 모드 전환 (침묵대기)';
  }
};

// Web Speech API 지원 확인
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function updateMicUI(listening) {
  const badge = $('micStatus');
  const text = $('micText');
  if (listening) {
    badge.className = 'mic-badge mic-listening';
    text.textContent = 'LISTENING';
  } else {
    badge.className = 'mic-badge mic-off';
    text.textContent = 'OFF';
  }
}

// 다중 발화 토큰 파싱 로직
// "A A A C B X" 또는 "에이 에이 에이 씨 비 엑스" 등 순서대로 모든 명령어 추출
function parseSpeechCommands(text) {
  const clean = text.toLowerCase().trim();
  const tokens = clean.split(/[\s,.]+/).filter(Boolean);
  const detected = [];

  // 각 토큰별 매핑 정의
  const mapA = ['a', '에이', '애이', '예이', 'eh'];
  const mapB = ['b', '비', 'bee', '미'];
  const mapC = ['c', '씨', '시', 'see', 'sea'];
  const mapX = ['x', '엑스', '액스', 'ex', 'eks', 'exes', '익스'];

  tokens.forEach(tok => {
    if (mapA.includes(tok)) detected.push('A');
    else if (mapB.includes(tok)) detected.push('B');
    else if (mapC.includes(tok)) detected.push('C');
    else if (mapX.includes(tok)) detected.push('X');
    else {
      // 띄어쓰기 없이 붙여서 인식된 경우(예: '에이에이', 'aab', '엑스엑스') 서브패턴 스캔
      let sub = tok;
      while (sub.length > 0) {
        if (sub.startsWith('에이') || sub.startsWith('애이')) { detected.push('A'); sub = sub.slice(2); }
        else if (sub.startsWith('엑스') || sub.startsWith('액스')) { detected.push('X'); sub = sub.slice(2); }
        else if (sub.startsWith('a')) { detected.push('A'); sub = sub.slice(1); }
        else if (sub.startsWith('b')) { detected.push('B'); sub = sub.slice(1); }
        else if (sub.startsWith('c')) { detected.push('C'); sub = sub.slice(1); }
        else if (sub.startsWith('x')) { detected.push('X'); sub = sub.slice(1); }
        else if (sub.startsWith('비')) { detected.push('B'); sub = sub.slice(1); }
        else if (sub.startsWith('씨') || sub.startsWith('시')) { detected.push('C'); sub = sub.slice(1); }
        else { break; }
      }
    }
  });

  return detected;
}

function initRecognition() {
  if (!SpeechRecognition) {
    alert('이 브라우저는 Web Speech API를 지원하지 않습니다.\nAndroid Chrome 또는 iOS Safari 최신 버전을 사용해주세요.');
    return null;
  }

  const rec = new SpeechRecognition();
  rec.lang = 'ko-KR'; // 한국어 모드
  rec.continuous = true; // 연속 청취 모드
  rec.interimResults = true; // FAST MODE를 위해 상시 interim 수신 활성화
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    updateMicUI(true);
  };

  rec.onresult = (event) => {
    // resultIndex부터 현재 results 끝까지 순회
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      const res = event.results[i];
      const isFinal = res.isFinal;
      const transcript = res[0].transcript;
      const parsedTokens = parseSpeechCommands(transcript);

      if (isFastMode) {
        // [FAST MODE]: interim 결과가 도착하는 즉시 신규 토큰만 카운트 (Deduplication)
        const alreadyConsumed = segmentConsumedCounts[i] || 0;
        
        if (parsedTokens.length > alreadyConsumed) {
          // 아직 카운트되지 않은 새로운 토큰들만 슬라이스
          const newTokens = parsedTokens.slice(alreadyConsumed);
          newTokens.forEach(cmd => triggerCount(cmd, 1));
          segmentConsumedCounts[i] = parsedTokens.length;
        }

        // 해당 세그먼트가 최종 완료(isFinal)되면 메모리 정리 및 확정
        if (isFinal) {
          segmentConsumedCounts[i] = Math.max(segmentConsumedCounts[i] || 0, parsedTokens.length);
        }
      } else {
        // [NORMAL MODE (기존 방식)]: interim은 무시하고 isFinal 확정 시에만 1회 처리
        if (isFinal) {
          if (parsedTokens.length > 0) {
            parsedTokens.forEach(cmd => triggerCount(cmd, 1));
          } else {
            $('recentLog').textContent = `미인식: "${transcript.trim()}"`;
          }
        }
      }
    }
  };

  rec.onerror = (event) => {
    console.warn('Speech recognition error:', event.error);
    if (event.error === 'not-allowed') {
      alert('마이크 사용 권한이 거부되었습니다. 브라우저 설정에서 마이크를 허용해주세요.');
      isUserListening = false;
      updateMicUI(false);
    }
  };

  rec.onend = () => {
    updateMicUI(false);
    // 사용자가 종료 버튼을 누르지 않았는데 연결이 끊긴 경우 자동 재시작
    if (isUserListening) {
      clearTimeout(restartTimeout);
      restartTimeout = setTimeout(() => {
        if (isUserListening) {
          try {
            rec.start();
          } catch (e) {
            console.log('재시작 대기:', e);
          }
        }
      }, 250);
    }
  };

  return rec;
}

// "음성 시작" 버튼
$('startBtn').onclick = () => {
  if (!recognition) {
    recognition = initRecognition();
    if (!recognition) return;
  }
  isUserListening = true;
  for (const k in segmentConsumedCounts) delete segmentConsumedCounts[k];
  try {
    recognition.start();
  } catch (e) {
    // 이미 실행 중인 경우
  }
};

// "음성 종료" 버튼
$('stopBtn').onclick = () => {
  isUserListening = false;
  clearTimeout(restartTimeout);
  if (recognition) {
    try {
      recognition.stop();
    } catch (e) {}
  }
  updateMicUI(false);
};

// ==========================================
// Cloudflare Worker API 연동 및 저장 기능
// ==========================================
const API_URL = 'https://eggplant-field-survey-api.brandonjungtae-kim.workers.dev/records';
const LOCAL_STORAGE_BACKUP_KEY = 'eggplantSurvey_localBackup';
let statusHideTimeout = null;

// 상태 메시지 표시
function showSaveStatus(text, type) {
  const el = $('saveStatus');
  el.style.display = 'block';
  el.textContent = text;
  el.className = `save-status-msg status-${type}`;

  clearTimeout(statusHideTimeout);
  // 5초 후 자동 숨김
  statusHideTimeout = setTimeout(() => {
    el.style.display = 'none';
  }, 5000);
}

// 오프라인/로컬스토리지 백업 저장
function saveToLocalStorage(record) {
  try {
    const records = JSON.parse(localStorage.getItem(LOCAL_STORAGE_BACKUP_KEY) || '[]');
    const idx = records.findIndex(r => 
      r.surveyDate === record.surveyDate && 
      r.farmId === record.farmId && 
      r.individualId === record.individualId
    );
    if (idx >= 0) {
      records[idx] = record;
    } else {
      records.push(record);
    }
    localStorage.setItem(LOCAL_STORAGE_BACKUP_KEY, JSON.stringify(records));
  } catch (e) {
    console.error('localStorage 백업 실패:', e);
  }
}

// "저장 + 다음" 버튼 이벤트
$('btnSaveNext').onclick = async () => {
  const indId = $('individualId').value.trim();
  if (!indId) {
    showSaveStatus('⚠ 개체 ID를 입력해주세요.', 'warn');
    $('individualId').focus();
    return;
  }

  const farmId = $('farmId').value;
  const farmerName = FARM_OWNERS[farmId] || '';
  const surveyDate = $('surveyDate').value || getTodayString();
  const researcherId = $('researcherId').value;
  const noteVal = $('note').value.trim();

  // POST 데이터 페이로드 생성
  const payload = {
    surveyDate: surveyDate,
    researcherId: researcherId,
    farmId: farmId,
    farmerName: farmerName,
    individualId: indId,
    healthyFruit: counts.A,
    sickFruit: counts.B,
    healthyBud: counts.C,
    sickBud: counts.X,
    diseaseRate: null,
    note: noteVal
  };

  // 1. 서버 장애를 대비해 기기 로컬스토리지에 항상 안전하게 보관
  saveToLocalStorage(payload);

  // 2. 연속 클릭 방지 (disabled 처리)
  const btn = $('btnSaveNext');
  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.textContent = '⏳ 저장 중...';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    let resData = null;
    try {
      resData = await res.json();
    } catch (e) {
      // JSON 파싱 실패 시 res.ok로 판단
    }

    if (res.ok && (!resData || resData.ok !== false)) {
      // [저장 성공]
      showSaveStatus('✓ 저장 완료', 'success');

      // A/B/C/X 카운터 초기화
      counts.A = 0;
      counts.B = 0;
      counts.C = 0;
      counts.X = 0;
      updateUI();

      // 세그먼트 토큰 기록 초기화
      for (const k in segmentConsumedCounts) delete segmentConsumedCounts[k];

      // 비고 및 개체 ID 초기화 (조사자 및 농가는 그대로 유지)
      $('note').value = '';
      $('individualId').value = '';
      $('individualId').focus();
    } else if (resData && (resData.duplicate === true || res.status === 409)) {
      // [중복 데이터]
      showSaveStatus('⚠ 이미 조사된 개체입니다.', 'warn');
      // 카운터는 초기화하지 않음!
    } else {
      // [서버 오류 응답]
      showSaveStatus('⚠ 서버 저장 실패 — 데이터는 이 기기에 보관되었습니다.', 'error');
      // 카운터는 초기화하지 않음!
    }
  } catch (netErr) {
    // [네트워크 오류 발생]
    console.warn('Network error during save:', netErr);
    showSaveStatus('⚠ 서버 저장 실패 — 데이터는 이 기기에 보관되었습니다.', 'error');
    // 카운터는 초기화하지 않음!
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
};

// 초기 화면 세팅
$('surveyDate').value = getTodayString();
updateUI();
</script>
